services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketmaster
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis (topology / caching) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  # ── MongoDB (topology storage) ─────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "27017"

  # ── ClickHouse (centralized logging) ───────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: logs
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user default --password clickhouse --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "8123"

  # ── Serverlayer (x86_64 binary) ─────────────────────────────────
  server:
    build:
      context: .
      dockerfile: serverlayer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      HOST: "0.0.0.0"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ticketmaster
      REDIS_URL: "redis://redis:6379"
      MONGO_URL: "mongodb://mongo:mongo@mongo:27017"
      MONGO_DB: "ticketmaster"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: "logs"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "clickhouse"
      TM_CONSUMER_KEY: "JVGgt7XEa7zZGzpZ4OtgoA4j5vWQywQ1"
      TM_CONSUMER_SECRET: "r8Li8UGl6k0ZHLNy"
      TM_BASE_URL: "https://app.ticketmaster.com"
      TM_API_VERSION: "v2"
    expose:
      - "3000"

  # ── Workerslayer (x86_64 binary) ────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: workerslayer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      PORT: "3001"
      HOST: "0.0.0.0"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ticketmaster
      REDIS_URL: "redis://redis:6379"
      MONGO_URL: "mongodb://mongo:mongo@mongo:27017"
      MONGO_DB: "ticketmaster"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: "logs"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "clickhouse"
    expose:
      - "3001"

  # ── OpenResty (nginx + lua) ─────────────────────────────────────
  nginx:
    build:
      context: nginx-http3
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - server
      - worker
      - transparency-proxy
      - puppeteer-proxy
    ports:
      - "80:80"
      - "443:443"

      # - "8181:80/tcp"
      # - "8443:443/tcp"
    volumes:
      - ./bins/weblayer:/var/www/weblayer:ro
      - ./nginx-http3/certs:/etc/nginx/certs:ro

  # ── Puppeteer Proxy (headless Chrome rendering pool) ─────────────
  puppeteer-proxy:
    build:
      context: puppeteer-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3100"
      POOL_SIZE: "3"
      PAGE_TIMEOUT: "30000"
    expose:
      - "3100"
    deploy:
      resources:
        limits:
          memory: 2g

  # ── Transparency Proxy (ticketmaster.com → localhost) ───────────
  transparency-proxy:
    build:
      context: transparency-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROXY_BASE_URL: "https://194.76.224.148"
      # UPSTREAM_PROXY: "http://user:pass@proxy-host:8080"
    volumes:
      - ./bins/decache:/var/cache/decentralized
    expose:
      - "80"

volumes:
  pgdata:
  mongodata:
  chdata:
