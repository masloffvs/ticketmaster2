worker_processes auto;
error_log /var/log/openresty/error.log warn;
pid       /run/openresty.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/openresty/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # ── DNS resolver for external proxy_pass ─────────────────────
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # ── Cache zone for TM API proxying ───────────────────────────
    proxy_cache_path /var/cache/nginx/tm_api levels=1:2
                     keys_zone=tm_api_cache:10m
                     max_size=500m
                     inactive=1h
                     use_temp_path=off;

    # ── Upstream: serverlayer binary ──────────────────────────────
    upstream api_backend {
        server server:3000;
        keepalive 32;
    }

    # ── Upstream: transparency proxy ─────────────────────────────
    upstream transparency {
        server transparency-proxy:80;
        keepalive 16;
    }

    # ── HTTP -> HTTPS redirect ────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /health {
            access_log off;
            content_by_lua_block {
                ngx.say("ok")
            }
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server (HTTP/2 with h1 backend degradation) ───
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # ── Static weblayer assets (under /weblayer/ prefix) ─────
        location /weblayer/ {
            alias /var/www/weblayer/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── TM Manifest API proxy (seat availability) ──────────────
        location ~ ^/api/tm/manifest/([^/]+)$ {
            set $event_id $1;
            proxy_pass https://availability.ticketmaster.se/api/v2/TM_SE/manifest/$event_id;
            proxy_ssl_server_name on;
            proxy_set_header Host availability.ticketmaster.se;
            proxy_set_header Accept-Encoding "identity";
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Connection "";

            proxy_cache tm_api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_valid any 30s;
            proxy_cache_use_stale error timeout updating;

            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ── TM Geometry API proxy (venue map) ─────────────────────
        location ~ ^/api/tm/geometry/([^/]+)$ {
            set $event_id $1;
            set $geo_args "systemId=MFX&useHostGrids=true&domain=Sweden&app=PRD1741_ICCP-FE";
            proxy_pass https://mapsapi.tmol.co/maps/geometry/3/event/$event_id/placeDetailNoKeys?$geo_args;
            proxy_ssl_server_name on;
            proxy_set_header Host mapsapi.tmol.co;
            proxy_set_header Accept-Encoding "identity";
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Connection "";

            proxy_cache tm_api_cache;
            proxy_cache_valid 200 30m;
            proxy_cache_valid any 1m;
            proxy_cache_use_stale error timeout updating;

            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ── API proxy (HTTP/2 -> HTTP/1.1 degradation) ───────────
        location /api/ {
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Lua: inject request-id
            set_by_lua_block $req_id {
                return ngx.var.request_id or require("resty.string").random(16)
            }
            proxy_set_header X-Request-ID $req_id;
        }

        # ── Swagger passthrough ───────────────────────────────────
        location /swagger {
            proxy_pass http://api_backend/swagger;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # ── /event/:slug/:id и /:slug/event/:id → наш SPA ──────────
        location ~ ^/event/[^/]+/[^/]+$ {
            root /var/www/weblayer;
            try_files /index.html =404;

            header_filter_by_lua_block {
                ngx.header["X-Content-Type-Options"] = "nosniff"
                ngx.header["X-Frame-Options"] = "SAMEORIGIN"
                ngx.header["X-XSS-Protection"] = "1; mode=block"
                ngx.header["Referrer-Policy"] = "strict-origin-when-cross-origin"
            }
        }

        location ~ ^/[^/]+/event/[A-Za-z0-9]+$ {
            root /var/www/weblayer;
            try_files /index.html =404;

            header_filter_by_lua_block {
                ngx.header["X-Content-Type-Options"] = "nosniff"
                ngx.header["X-Frame-Options"] = "SAMEORIGIN"
                ngx.header["X-XSS-Protection"] = "1; mode=block"
                ngx.header["Referrer-Policy"] = "strict-origin-when-cross-origin"
            }
        }

        # ── Admin shell → наш SPA ─────────────────────────────────
        location /shell {
            root /var/www/weblayer;
            try_files /index.html =404;

            header_filter_by_lua_block {
                ngx.header["X-Content-Type-Options"] = "nosniff"
                ngx.header["X-Frame-Options"] = "SAMEORIGIN"
                ngx.header["X-XSS-Protection"] = "1; mode=block"
                ngx.header["Referrer-Policy"] = "strict-origin-when-cross-origin"
            }
        }

        # ── Proxy traffic metrics → transparency-proxy ────────────
        location /api/proxy-metrics {
            proxy_pass http://transparency/metrics/traffic;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/proxy-recent {
            proxy_pass http://transparency/metrics/recent;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Auth: identity.ticketmaster.com → наш SPA ─────────────
        location /sign-in {
            root /var/www/weblayer;
            try_files /index.html =404;

            header_filter_by_lua_block {
                ngx.header["X-Content-Type-Options"] = "nosniff"
                ngx.header["X-Frame-Options"] = "SAMEORIGIN"
                ngx.header["X-XSS-Protection"] = "1; mode=block"
                ngx.header["Referrer-Policy"] = "strict-origin-when-cross-origin"
            }
        }

        location /_sub/identity/sign-in {
            return 301 /sign-in$is_args$args;
        }

        # ── Всё остальное → transparency proxy (ticketmaster.com) ─
        location / {
            proxy_pass http://transparency;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
